spring.application.name=cloudpulse

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# HikariCP — tuned for Supabase which drops idle connections after ~5 min
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.connection-timeout=20000

# Security
cloudpulse.jwt.secret=${JWT_SECRET}
cloudpulse.jwt.expiration-hours=24

# Jackson
spring.jackson.property-naming-strategy=SNAKE_CASE

# Scheduling
cloudpulse.scheduler.tick-ms=${SCHEDULER_TICK_MS:5000}

# Alerting
cloudpulse.alerting.consecutive-failures-threshold=${CONSECUTIVE_FAILURES_THRESHOLD:3}

# Email
cloudpulse.resend.api-key=${RESEND_API_KEY:}
cloudpulse.alert.email-from=${ALERT_EMAIL_FROM:CloudPulse <alerts@cloudpulse.dev>}
cloudpulse.alert.email-to=${ALERT_EMAIL_TO:}

# Telegram
cloudpulse.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
cloudpulse.telegram.bot-username=${TELEGRAM_BOT_USERNAME:}

# CORS
cloudpulse.cors.allowed-origins=${CORS_ORIGINS}

# API Docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true

# DevTools
spring.devtools.livereload.port=35729
spring.h2.console.enabled=false

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Logging
logging.level.com.avantdream.cloudpulse=INFO
logging.level.org.hibernate.SQL=debug

# Virtual threads (Java 21)
spring.threads.virtual.enabled=true
