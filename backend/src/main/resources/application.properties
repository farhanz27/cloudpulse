spring.application.name=cloudpulse

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cloudpulse}
spring.datasource.username=${DB_USERNAME:cloudpulse}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT
cloudpulse.jwt.secret=${JWT_SECRET:change-me-in-production-must-be-at-least-32-chars}
cloudpulse.jwt.expiration-hours=24

# Scheduling
cloudpulse.scheduler.tick-ms=${SCHEDULER_TICK_MS:5000}

# Alerting
cloudpulse.alerting.consecutive-failures-threshold=${CONSECUTIVE_FAILURES_THRESHOLD:3}

# Email (Resend preferred)
cloudpulse.resend.api-key=${RESEND_API_KEY:}
cloudpulse.alert.email-from=${ALERT_EMAIL_FROM:CloudPulse <alerts@cloudpulse.dev>}
cloudpulse.alert.email-to=${ALERT_EMAIL_TO:}

# SMTP fallback
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:true}

# Telegram
cloudpulse.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
cloudpulse.telegram.bot-username=${TELEGRAM_BOT_USERNAME:}

# Env-level webhook
cloudpulse.webhook.url=${WEBHOOK_URL:}

# CORS
cloudpulse.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Virtual threads (Java 21)
spring.threads.virtual.enabled=true

server.port=8080
logging.level.com.avantdream.cloudpulse=INFO
